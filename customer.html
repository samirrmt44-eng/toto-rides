<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TOTO Customer - 1 Tap Book</title>
<meta name="theme-color" content="#10b981">
<link rel="manifest" href="manifest-customer.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f0fdf4;color:#1a1a2e}
.top{background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;border-bottom:1px solid #dcfce7}
.btn{padding:14px 20px;border:none;border-radius:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px} .btn-b{background:#0ea5e9;color:#fff}.btn-g{background:#10b981;color:#fff}.btn-w{background:#fff;border:1px solid #e2e8f0}
.btn-full{width:100%;justify-content:center}.btn-big{padding:18px;font-size:18px}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 80px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 12px rgba(0,0,0,.05);border:1px solid #f0fdf4}
#map{width:100%;height:360px;border-radius:18px;border:3px solid #fff;box-shadow:0 8px 30px rgba(0,0,0,.1);background:#dcfce7}
.inp-box{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #dcfce7}.inp-row{display:flex;align-items:center;gap:8px;padding:14px}
.inp-row+.inp-row{border-top:1px solid #f0fdf4}.inp-dot{width:12px;height:12px;border-radius:50%}.g{background:#10b981}.r{background:#ef4444}.inp-field{flex:1;border:none;font-size:15px;font-weight:700;outline:none}
.voice-btn{width:36px;height:36px;border-radius:10px;border:none;background:#f0fdf4;color:#10b981;font-size:16px;cursor:pointer}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:.3s;pointer-events:none}#toast.show{opacity:1}
</style>
</head>
<body>
<div class="top"><h1 style="color:#10b981">👤 TOTO Customer</h1><span style="font-size:11px;background:#ecfdf5;color:#059669;padding:4px 10px;border-radius:20px;font-weight:800" id="cityBadge">Ramgarh</span></div>
<div id="toast"></div>
<div class="wrap">
  <div style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-radius:20px;padding:18px;text-align:center;margin:0 0 12px">
    <div style="font-size:32px">👤</div><h2 style="font-size:22px;font-weight:900">Customer - No Approval Needed</h2><p style="font-size:12px;opacity:.9">Sabhi jud sakte hain - 1 Tap Booking</p>
  </div>

  <div style="display:flex;gap:8px;overflow-x:auto;padding:8px 0" id="cityQuick"></div>

  <div style="position:relative;margin:12px 0"><div id="map"></div><div style="position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:999"><button onclick="map&&map.zoomIn()" style="width:40px;height:40px;border-radius:12px;border:none;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)">➕</button><button onclick="goLocate()" style="width:40px;height:40px;border-radius:12px;border:none;background:#10b981;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)">📍</button></div></div>

  <div class="inp-box">
    <div class="inp-row"><div class="inp-dot g"></div><input class="inp-field" id="fromIn" placeholder="📍 Kahan se? (GPS Auto)"><button class="voice-btn" onclick="startVoice('from')">🎤</button><button onclick="goLocate()" style="border:none;background:#ecfdf5;color:#059669;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:800">GPS</button></div>
    <div class="inp-row"><div class="inp-dot r"></div><input class="inp-field" id="toIn" placeholder="🏁 Kahan jana hai? Bolo ya likho"><button class="voice-btn" onclick="startVoice('to')">🎤</button><button onclick="document.getElementById('toIn').value='';toLL=null" style="border:none;background:#fef2f2;color:#ef4444;padding:6px 10px;border-radius:8px;font-size:11px">Clear</button></div>
  </div>

  <div id="fareBox" style="display:none;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #0ea5e9;border-radius:18px;padding:16px;text-align:center;margin:12px 0"><div style="font-size:11px;font-weight:800;color:#0369a1">FARE</div><div style="font-size:36px;font-weight:900;color:#0ea5e9" id="fareVal">₹0</div></div>

  <button class="btn btn-g btn-full btn-big" onclick="bookRide()">🚀 1 Tap me TOTO Book Karo</button>
  <div id="bookSt" style="display:none;margin:12px 0"></div>

  <div style="margin-top:16px"><h3 style="font-size:14px;font-weight:900">🛺 Pass Ke Drivers</h3><div id="drvList" style="margin-top:8px"></div></div>

  <div style="margin-top:16px;background:#fffbeb;border:2px solid #fbbf24;border-radius:16px;padding:12px"><p style="font-size:12px;font-weight:800;color:#92400e">🎤 Voice Control - Driver Friendly</p><p style="font-size:11px;margin-top:4px">Mic dabao aur bolo: "Ramgarh se Ranchi jana hai" - Auto fill ho jayega!</p></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const CITIES={ramgarh:{name:'Ramgarh',lat:23.63,lng:85.51},hazaribagh:{name:'Hazaribagh',lat:23.99,lng:85.36},ranchi:{name:'Ranchi',lat:23.34,lng:85.31},dhanbad:{name:'Dhanbad',lat:23.80,lng:86.43},patna:{name:'Patna',lat:25.61,lng:85.14},kolkata:{name:'Kolkata',lat:22.57,lng:88.36}};
const DEMOS={ramgarh:[{n:'Ram Prasad',t:'auto',num:'JH02A1234',r:4.8,lat:23.63,lng:85.51,area:'Bus Stand',ph:'919000000001'}],ranchi:[{n:'Ajay',t:'auto',num:'JH01A1111',r:4.7,lat:23.35,lng:85.32,area:'Main Road',ph:'919000000005'}]};
let map=null,city=null,fromLL=null,toLL=null,fromMk=null,toMk=null,routeLn=null,db=null,fb=false;
try{firebase.initializeApp({apiKey:"AIzaSyDJdRvlWn4UNqu2JSwRayHg49qEymG55KY",authDomain:"toto-rides.firebaseapp.com",databaseURL:"https://toto-rides-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"toto-rides"});db=firebase.database();fb=true;}catch(e){}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',3000);}
function initQuick(){const box=document.getElementById('cityQuick');box.innerHTML=Object.keys(CITIES).map(id=>`<button onclick="pickCity('${id}')" style="flex-shrink:0;padding:8px 14px;border-radius:20px;border:2px solid #10b981;background:#fff;color:#10b981;font-weight:800;font-size:12px">${CITIES[id].name}</button>`).join('');}
function pickCity(id){const c=CITIES[id];city={id,name:c.name,lat:c.lat,lng:c.lng};document.getElementById('cityBadge').textContent='📍 '+c.name;try{localStorage.setItem('totoCity',id);}catch{} setTimeout(()=>{initMap(c.lat,c.lng);loadDrivers();},150); toast('✅ '+c.name);}
function initMap(lat,lng){try{if(map)map.remove(); map=L.map('map',{center:[lat,lng],zoom:13,zoomControl:false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map); map.on('click',e=>{ if(!fromLL) setFrom(e.latlng.lat,e.latlng.lng); else setTo(e.latlng.lat,e.latlng.lng); }); setTimeout(()=>map.invalidateSize(),400); setFrom(lat,lng);}catch(e){}}
function setFrom(lat,lng){if(fromMk&&map)try{map.removeLayer(fromMk);}catch{} fromLL={lat,lng}; if(map) fromMk=L.marker([lat,lng],{icon:L.divIcon({html:'<div style="width:20px;height:20px;background:#10b981;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff"></div>',iconSize:[20,20]})}).addTo(map); document.getElementById('fromIn').value=lat.toFixed(4)+','+lng.toFixed(4); if(toLL) doRoute();}
function setTo(lat,lng){if(toMk&&map)try{map.removeLayer(toMk);}catch{} toLL={lat,lng}; if(map) toMk=L.marker([lat,lng],{icon:L.divIcon({html:'<div style="width:20px;height:20px;background:#ef4444;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff"></div>',iconSize:[20,20]})}).addTo(map); document.getElementById('toIn').value=lat.toFixed(4)+','+lng.toFixed(4); doRoute();}
function doRoute(){if(!fromLL||!toLL||!map) return; fetch(`https://router.project-osrm.org/route/v1/driving/${fromLL.lng},${fromLL.lat};${toLL.lng},${toLL.lat}?overview=full&geometries=geojson`).then(r=>r.json()).then(d=>{ if(d.code==='Ok'){ const route=d.routes[0]; const coords=route.geometry.coordinates.map(c=>[c[1],c[0]]); const km=(route.distance/1000).toFixed(1); const fare=Math.round(15+km*8); if(routeLn) try{map.removeLayer(routeLn);}catch{} routeLn=L.polyline(coords,{color:'#0ea5e9',weight:5}).addTo(map); map.fitBounds(routeLn.getBounds(),{padding:[40,40]}); document.getElementById('fareBox').style.display='block'; document.getElementById('fareVal').textContent='₹'+fare+' ('+km+' km)'; } }).catch(()=>{}); }
function goLocate(){if(!navigator.geolocation){toast('GPS not supported');return;} navigator.geolocation.getCurrentPosition(p=>{ const lat=p.coords.latitude,lng=p.coords.longitude; if(map) map.setView([lat,lng],15); setFrom(lat,lng); },()=>toast('GPS error'),{enableHighAccuracy:true});}
function loadDrivers(){ if(!city) return; let drivers=(DEMOS[city.id]||[]); const list=document.getElementById('drvList'); list.innerHTML=drivers.map(d=>`<div style="background:#fff;border-radius:12px;padding:12px;margin:6px 0;display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:12px;background:#0ea5e9;display:flex;align-items:center;justify-content:center;color:#fff">🛺</div><div style="flex:1"><b>${d.n}</b><div style="font-size:11px;color:#64748b">📍 ${d.area} • ${d.num} • ⭐ ${d.r}</div></div><button onclick="window.open('tel:${d.ph}')" style="background:#10b981;color:#fff;border:none;width:40px;height:40px;border-radius:10px">📞</button></div>`).join(''); }
function bookRide(){ if(!fromLL||!toLL){toast('Map par 2 jagah tap karo');return;} const fare=document.getElementById('fareVal').textContent; const el=document.getElementById('bookSt'); el.style.display='block'; el.innerHTML=`<div style="background:#ecfdf5;border:2px solid #10b981;border-radius:16px;padding:16px;text-align:center"><div style="font-size:28px">✅</div><div style="font-weight:900;color:#059669">Booked! ${fare}</div><p style="font-size:12px">Driver 2 min me call karega</p></div>`; toast('🎉 Booked!'); if(fb&&city){ const b={id:'BK'+Date.now(),from:document.getElementById('fromIn').value,to:document.getElementById('toIn').value,fare:fare,status:'pending',city:city.id,time:new Date().toISOString()}; db.ref('toto_bookings/'+b.id).set(b); } }
// Voice Control
function startVoice(target){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('🎤 Voice not supported - Chrome me kholo'); return; }
  const rec = new SR(); rec.lang='hi-IN'; rec.interimResults=false;
  toast('🎤 Bolo... "Ramgarh se Ranchi"');
  rec.start();
  rec.onresult = e=>{
    const text=e.results[0][0].transcript;
    toast('🎤 Suna: '+text);
    if(target==='from' || target==='to'){
      document.getElementById(target==='from'?'fromIn':'toIn').value=text;
      // Try to geocode via Nominatim for Jharkhand
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(text+', Jharkhand')}&limit=1`).then(r=>r.json()).then(d=>{
        if(d[0]){ const lat=parseFloat(d[0].lat), lng=parseFloat(d[0].lon); if(target==='from') setFrom(lat,lng); else setTo(lat,lng); if(map) map.setView([lat,lng],14); }
      }).catch(()=>{});
    }else{
      // General command
      if(text.toLowerCase().includes('book')) bookRide();
      else if(text.toLowerCase().includes('gps')||text.toLowerCase().includes('location')) goLocate();
    }
  };
  rec.onerror=()=>toast('🎤 Voice error - fir se try karo');
}

document.addEventListener('DOMContentLoaded', ()=>{
  initQuick();
  const p=new URLSearchParams(location.search);
  const q=p.get('city')||localStorage.getItem('totoCity')||'ramgarh';
  setTimeout(()=>{ if(CITIES[q]) pickCity(q); }, 500);
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
});
</script>
</body>
</html>
